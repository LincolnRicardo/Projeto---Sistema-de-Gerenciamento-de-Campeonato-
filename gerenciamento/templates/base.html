<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Campeonato{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Bebas Neue', sans-serif; }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">

  <nav class="bg-gray-900 border-b border-green-500/30 px-6 py-4">
    <div class="max-w-5xl mx-auto flex items-center gap-8">
      <span class="font-display text-2xl text-green-400 tracking-wider">⚽ CAMPEONATO</span>
      <a href="/" class="text-gray-300 hover:text-green-400 transition text-sm font-medium">Dashboard</a>
      
      <a href="/admin/" class="ml-auto text-gray-500 hover:text-white transition text-xs">Admin</a>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-6 py-8">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
