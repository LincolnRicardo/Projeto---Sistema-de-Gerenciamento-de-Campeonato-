{% extends 'base.html' %}
{% block title %}Adicionar Time{% endblock %}
{% block content %}

<h1 class="font-display text-4xl text-green-400 mb-6 tracking-wider">➕ NOVO TIME</h1>

<div class="bg-gray-900 border border-gray-800 rounded-xl p-6 max-w-lg">
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {% for field in form %}
    <div class="mb-4">
      <label class="text-gray-400 text-sm mb-1 block">{{ field.label }}</label>
      {{ field }}
    </div>
    {% endfor %}
    <button type="submit"
      class="bg-green-600 hover:bg-green-500 text-white font-medium px-6 py-2 rounded-lg text-sm transition">
      Salvar Time
    </button>
    <a href="{% url 'times-lista' %}"
      class="ml-3 text-gray-500 hover:text-white text-sm transition">
      Cancelar
    </a>
  </form>
</div>

{% endblock %}
